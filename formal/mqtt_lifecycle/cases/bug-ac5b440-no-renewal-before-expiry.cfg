\* Replays the bug fixed by ac5b440: the connection is kept past the expiry of its credentials.
\* expect: violates NoPublishOnExpiredCredentials
SPECIFICATION Spec
CONSTANTS
    MaxClients = 2
    Batches = 2
    Lifetime = 2
    Margin = 1
    MaxTime = 3
    MaxPahoReconnects = 1
    RenewBeforeExpiry = FALSE
    WaitForConnack = TRUE
    StaleClientGuard = TRUE
    EvaluateAfterSend = TRUE
    RefuseLostConnection = TRUE
    RecheckAfterWake = TRUE
    SubscribingPerClient = TRUE
    RefuseOnlyUnanswered = TRUE
INVARIANTS
    TypeOK
    PublishOnlyAfterConnack
    NoPublishOnExpiredCredentials
    NoPublishOnDroppedConnection
    PushVerdictFromCurrentClient
    PushVerdictFromItsOwnSubscription
    PushDefinite
    RefusalNeedsUnansweredSubscribe
