\* Replays a bug the model found in the shipped code: a waiting command resumes on a connection lost since it was woken.
\* expect: violates NoPublishOnDroppedConnection
SPECIFICATION Spec
CONSTANTS
    MaxClients = 2
    Batches = 2
    Lifetime = 2
    Margin = 1
    MaxTime = 3
    MaxPahoReconnects = 1
    RenewBeforeExpiry = TRUE
    WaitForConnack = TRUE
    StaleClientGuard = TRUE
    EvaluateAfterSend = TRUE
    RefuseLostConnection = TRUE
    RecheckAfterWake = FALSE
    SubscribingPerClient = TRUE
    RefuseOnlyUnanswered = TRUE
INVARIANTS
    TypeOK
    PublishOnlyAfterConnack
    NoPublishOnExpiredCredentials
    NoPublishOnDroppedConnection
    PushVerdictFromCurrentClient
    PushVerdictFromItsOwnSubscription
    PushDefinite
    RefusalNeedsUnansweredSubscribe
