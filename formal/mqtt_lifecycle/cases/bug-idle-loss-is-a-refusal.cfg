\* Replays a bug the model found in the shipped code: a connection lost while no SUBSCRIBE awaits an answer is a refusal.
\* expect: violates RefusalNeedsUnansweredSubscribe
SPECIFICATION Spec
CONSTANTS
    MaxClients = 2
    Batches = 2
    Lifetime = 2
    Margin = 1
    MaxTime = 3
    MaxPahoReconnects = 1
    RenewBeforeExpiry = TRUE
    WaitForConnack = TRUE
    StaleClientGuard = TRUE
    EvaluateAfterSend = TRUE
    RefuseLostConnection = TRUE
    RecheckAfterWake = TRUE
    SubscribingPerClient = TRUE
    RefuseOnlyUnanswered = FALSE
INVARIANTS
    TypeOK
    PublishOnlyAfterConnack
    NoPublishOnExpiredCredentials
    NoPublishOnDroppedConnection
    PushVerdictFromCurrentClient
    PushVerdictFromItsOwnSubscription
    PushDefinite
    RefusalNeedsUnansweredSubscribe
