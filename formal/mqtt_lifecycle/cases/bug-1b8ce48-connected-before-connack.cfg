\* Replays the bug fixed by 1b8ce48: the connection counts as usable before the CONNACK.
\* expect: violates PublishOnlyAfterConnack
SPECIFICATION Spec
CONSTANTS
    MaxClients = 2
    Batches = 2
    Lifetime = 2
    Margin = 1
    MaxTime = 3
    MaxPahoReconnects = 1
    RenewBeforeExpiry = TRUE
    WaitForConnack = FALSE
    StaleClientGuard = TRUE
    EvaluateAfterSend = TRUE
    RefuseLostConnection = TRUE
    RecheckAfterWake = TRUE
    SubscribingPerClient = TRUE
INVARIANTS
    TypeOK
    PublishOnlyAfterConnack
    NoPublishOnExpiredCredentials
    NoPublishOnDroppedConnection
    PushVerdictFromCurrentClient
    PushVerdictFromItsOwnSubscription
    PushDefinite
