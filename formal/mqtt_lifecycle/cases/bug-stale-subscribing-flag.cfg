\* Replays a bug the model found in the shipped code: _subscribing outlives the client it was set for.
\* expect: violates PushVerdictFromItsOwnSubscription
SPECIFICATION Spec
CONSTANTS
    MaxClients = 2
    Batches = 2
    Lifetime = 2
    Margin = 1
    MaxTime = 3
    MaxPahoReconnects = 1
    RenewBeforeExpiry = TRUE
    WaitForConnack = TRUE
    StaleClientGuard = TRUE
    EvaluateAfterSend = TRUE
    RefuseLostConnection = TRUE
    RecheckAfterWake = TRUE
    SubscribingPerClient = FALSE
    RefuseOnlyUnanswered = TRUE
INVARIANTS
    TypeOK
    PublishOnlyAfterConnack
    NoPublishOnExpiredCredentials
    NoPublishOnDroppedConnection
    PushVerdictFromCurrentClient
    PushVerdictFromItsOwnSubscription
    PushDefinite
    RefusalNeedsUnansweredSubscribe
