[project]
name = "salus-it600-cloud"
version = "1.1.0"
requires-python = ">=3.14.2"

[dependency-groups]
test = [
    "pycognito==2024.5.1",
    "pytest-homeassistant-custom-component==0.13.375",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
