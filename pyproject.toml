[project]
name = "salus-it600-cloud"
version = "1.1.0"
requires-python = ">=3.14.2"

[dependency-groups]
test = [
    "homeassistant==2026.11.2",
    "paho-mqtt==2.2.0",
    "pycognito==2024.5.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
